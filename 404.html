<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - The Nova Edits</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            text-align: center;
            font-family: 'Outfit', sans-serif;
        }
        .error-container {
            max-width: 500px;
            padding: 60px 40px;
            background: var(--bg-white);
            border-radius: 2px;
            box-shadow: none;
            border: 1px solid var(--border-light);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 6rem;
            color: var(--accent-primary);
            margin: 0 0 10px 0;
            line-height: 0.9;
            font-weight: 400;
        }
        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 500;
            margin: 0 0 20px 0;
            color: var(--text-primary);
        }
        p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 1rem;
        }
        .btn-home {
            display: inline-flex;
            padding: 14px 32px;
            background-color: var(--text-primary);
            color: var(--bg-primary);
            text-decoration: none;
            border-radius: 2px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
            transition: background-color var(--transition-fast);
        }
        .btn-home:hover {
            background-color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn-home">Back to Home</a>
    </div>
</body>
</html>
