<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your favourite items at The Nova Edits.">
    <title>Favourites - The Nova Edits</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shopping-cart.css"> <!-- Reusing cart styles for simplicity -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6eb67540cb.js" crossorigin="anonymous"></script>
    <style>
        .fav-item-remove {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            transition: opacity 0.2s;
        }
        .fav-item-remove:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 0;">
                <a href="index.html" class="logo" style="text-decoration: none;">
                    <img class="logo-img" src="NewLogo.svg" alt="logo">
                    <span class="logo-text">THE NOVA EDITS</span>
                </a>
                <a href="index.html" class="back-link" style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--navy-primary); text-decoration: none; padding: 8px 16px; background: #f1f5f9; border-radius: 24px; transition: background 0.2s;"><i class="fa-solid fa-arrow-left"></i> Back to Shop</a>
            </div>
        </div>
    </header>
    <main>
        <div class="container" style="max-width: 800px; margin: 40px auto;">
            <h2>Your Favourites</h2>
            <div id="fav-items" style="margin-top: 20px;"></div>
        </div>
    </main>

    <script src="products.js"></script>
    <script src="favourites.js"></script>

    <!-- Supabase & Session Management -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
</body>
</html>
